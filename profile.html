<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — AOTR Shop</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="trustpilot-one-time-domain-verification-id" content="9e197152-6270-4623-a242-e3dfde22233b"/>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>

  <div style="padding-top:58px;">
    <div id="auth-required" style="display:none;text-align:center;padding:100px 24px;">
      <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:8px;">Sign in to view your profile</h2>
      <p style="color:var(--text-muted);margin-bottom:24px;">Create an account or sign in to access your orders and favorites.</p>
      <button class="btn btn-primary" onclick="AuthModal.open()">Sign In</button>
    </div>

    <div id="profile-content" style="display:none;" class="container" style="padding-top:36px;padding-bottom:80px;">
      <div style="padding-top:36px;padding-bottom:80px;">
        <div class="profile-layout">

          <!-- Nav sidebar -->
          <aside class="profile-nav">
            <div class="profile-nav-item active" data-panel="orders">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/>
              </svg>
              Order History
            </div>
            <div class="profile-nav-item" data-panel="favorites">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              Favorites
            </div>
            <div class="profile-nav-item" data-panel="settings">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
              </svg>
              Settings
            </div>
            <div class="profile-nav-item" data-panel="logout" style="color:var(--red);border-top:1px solid var(--border);">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
              </svg>
              Sign Out
            </div>
          </aside>

          <!-- Panels -->
          <div>
            <!-- Orders -->
            <div class="profile-panel active" id="panel-orders">
              <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:20px;">Order History</h2>
              <div id="orders-list" class="order-list">
                <div class="skeleton" style="height:72px;border-radius:10px;"></div>
                <div class="skeleton" style="height:72px;border-radius:10px;"></div>
                <div class="skeleton" style="height:72px;border-radius:10px;"></div>
              </div>
              <div id="no-orders" style="display:none;text-align:center;padding:40px 0;color:var(--text-faint);font-size:.875rem;">No orders yet.</div>
            </div>

            <!-- Favorites -->
            <div class="profile-panel" id="panel-favorites">
              <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:20px;">Favorites</h2>
              <div class="items-grid" id="favorites-grid"></div>
              <div id="no-favorites" style="text-align:center;padding:40px 0;color:var(--text-faint);font-size:.875rem;">No favorites yet. Browse items and click the heart icon.</div>
            </div>

            <!-- Settings -->
            <div class="profile-panel" id="panel-settings">
              <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:24px;">Account Settings</h2>
              <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:460px;">
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input class="form-input" type="email" id="settings-email" readonly style="opacity:.6;">
                </div>
                <div class="form-group">
                  <label class="form-label">Username</label>
                  <input class="form-input" type="text" id="settings-username" placeholder="Your username">
                </div>
                <div class="divider"></div>
                <div class="form-group">
                  <label class="form-label">New Password</label>
                  <input class="form-input" type="password" id="settings-password" placeholder="Leave blank to keep current">
                </div>
                <div class="form-group">
                  <label class="form-label">Confirm New Password</label>
                  <input class="form-input" type="password" id="settings-password-confirm" placeholder="Repeat new password">
                </div>
                <div class="form-error" id="settings-error"></div>
                <button class="btn btn-primary" id="settings-save-btn" style="margin-top:8px;">Save Changes</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/profile.js"></script>
  <script src="https://code.tidio.co/1tjjpqufzpyjzjbajo7lh1jyknm34hoj.js" async></script>
</body>
</html>
