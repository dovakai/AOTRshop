<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — AOTR Shop</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="reviews">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>

  <div style="padding-top:64px;">
    <div class="container" style="padding-top:40px;padding-bottom:80px;">

      <div class="page-header" style="border:none;margin-bottom:28px;">
        <h1 class="page-header-title">Customer Reviews</h1>
        <p class="page-header-sub">Real feedback from verified buyers.</p>
      </div>

      <!-- Stats header -->
      <div class="reviews-header-block">
        <div class="reviews-avg">
          <span class="reviews-avg-num" id="avg-rating">—</span>
          <div id="avg-stars" style="display:flex;gap:3px;color:var(--gold);margin:4px 0;"></div>
          <span class="reviews-avg-label">Average Rating</span>
        </div>
        <div style="flex:1;">
          <p style="font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:4px;" id="total-reviews-label">Loading reviews...</p>
          <p style="font-size:.82rem;color:var(--text-muted);">Only verified buyers with completed orders can leave reviews.</p>
        </div>
      </div>

      <!-- Leave a review (if eligible) -->
      <div id="review-form-wrap" style="display:none;">
        <div class="reviews-form">
          <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px;">Leave a Review</h3>
          <div class="star-select" id="star-select">
            <button class="star-sel-btn" data-star="1">&#9733;</button>
            <button class="star-sel-btn" data-star="2">&#9733;</button>
            <button class="star-sel-btn" data-star="3">&#9733;</button>
            <button class="star-sel-btn" data-star="4">&#9733;</button>
            <button class="star-sel-btn" data-star="5">&#9733;</button>
          </div>
          <textarea class="form-input" id="review-comment" placeholder="Share your experience..." rows="3" style="resize:vertical;margin-bottom:12px;"></textarea>
          <div class="form-error" id="review-error"></div>
          <button class="btn btn-primary" id="submit-review-btn">Submit Review</button>
        </div>
      </div>

      <!-- Reviews grid -->
      <div id="reviews-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
        <div class="skeleton" style="height:160px;border-radius:10px;"></div>
        <div class="skeleton" style="height:160px;border-radius:10px;"></div>
        <div class="skeleton" style="height:160px;border-radius:10px;"></div>
      </div>

      <div id="no-reviews" style="display:none;text-align:center;padding:60px 0;color:var(--text-faint);">No reviews yet. Be the first!</div>

    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/reviews.js"></script>
  <script src="//code.tidio.co/1tjjpqufzpyjzjbajo7lh1jyknm34hoj.js" async></script>
</body>
</html>
